<div class="workflow-step">
  <div class="step-header">
    <div class="step-number">1</div>
    <div class="step-info">
      <h1>Company Registration</h1>
      <p>Register your company to start using our interview panel services</p>
    </div>
  </div>

  <div class="step-content">
    <div class="card">
      <div *ngIf="submitSuccess" class="alert alert-success">
        Company registered successfully! You can proceed to the next step.
      </div>

      <div *ngIf="submitError" class="alert alert-error">
        {{ submitError }}
      </div>

      <form (ngSubmit)="onSubmit()" class="workflow-form">
        <h3>Company Information</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="companyName">Company Name *</label>
            <input type="text" id="companyName" name="companyName" [(ngModel)]="formData.companyName" required placeholder="Your Company Name" class="form-input">
          </div>

          <div class="form-group">
            <label for="industry">Industry *</label>
            <select id="industry" name="industry" [(ngModel)]="formData.industry" required class="form-input">
              <option value="">Select Industry</option>
              <option value="technology">Technology</option>
              <option value="finance">Finance</option>
              <option value="healthcare">Healthcare</option>
              <option value="ecommerce">E-commerce</option>
              <option value="education">Education</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="companySize">Company Size *</label>
            <select id="companySize" name="companySize" [(ngModel)]="formData.companySize" required class="form-input">
              <option value="">Select Size</option>
              <option value="1-10">1-10 employees</option>
              <option value="11-50">11-50 employees</option>
              <option value="51-200">51-200 employees</option>
              <option value="201-500">201-500 employees</option>
              <option value="500+">500+ employees</option>
            </select>
          </div>

          <div class="form-group">
            <label for="website">Website</label>
            <input type="url" id="website" name="website" [(ngModel)]="formData.website" placeholder="https://yourcompany.com" class="form-input">
          </div>
        </div>

        <h3>Address Information</h3>
        
        <div class="form-group">
          <label for="address">Street Address *</label>
          <input type="text" id="address" name="address" [(ngModel)]="formData.address" required placeholder="123 Business Street" class="form-input">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="city">City *</label>
            <input type="text" id="city" name="city" [(ngModel)]="formData.city" required placeholder="City" class="form-input">
          </div>

          <div class="form-group">
            <label for="state">State *</label>
            <input type="text" id="state" name="state" [(ngModel)]="formData.state" required placeholder="State" class="form-input">
          </div>

          <div class="form-group">
            <label for="country">Country *</label>
            <input type="text" id="country" name="country" [(ngModel)]="formData.country" required placeholder="Country" class="form-input">
          </div>

          <div class="form-group">
            <label for="postalCode">Postal Code *</label>
            <input type="text" id="postalCode" name="postalCode" [(ngModel)]="formData.postalCode" required placeholder="12345" class="form-input">
          </div>
        </div>

        <h3>Primary Contact Information</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="primaryContactName">Contact Name *</label>
            <input type="text" id="primaryContactName" name="primaryContactName" [(ngModel)]="formData.primaryContactName" required placeholder="John Doe" class="form-input">
          </div>

          <div class="form-group">
            <label for="primaryContactEmail">Email *</label>
            <input type="email" id="primaryContactEmail" name="primaryContactEmail" [(ngModel)]="formData.primaryContactEmail" required placeholder="john@company.com" class="form-input">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="primaryContactPhone">Phone *</label>
            <input type="tel" id="primaryContactPhone" name="primaryContactPhone" [(ngModel)]="formData.primaryContactPhone" required placeholder="+91 9685794540" class="form-input">
          </div>

          <div class="form-group">
            <label for="primaryContactRole">Role *</label>
            <input type="text" id="primaryContactRole" name="primaryContactRole" [(ngModel)]="formData.primaryContactRole" required placeholder="HR Manager" class="form-input">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Registering...' : 'Register Company' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
